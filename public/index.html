<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panorama Notícias</title>
  <meta name="description" content="Notícias do mundo, dos Estados Unidos e do Brasil, das principais fontes, em um só lugar.">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Panorama">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=Inter+Tight:wght@400;500;600;700&display=swap">
  <style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica tema e tamanho de texto antes de pintar a página (evita "piscar").
    try {
      var p = JSON.parse(localStorage.getItem('panorama:prefs') || '{}');
      if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme);
      if (p.size) document.documentElement.setAttribute('data-size', p.size);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
